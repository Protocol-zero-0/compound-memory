# compound-memory 配置。install.sh 会把这份文件复制成 ~/.compound-memory/config.yaml,
# 之后只改那一份;这里保持为示例。所有 ~ 会展开成你的主目录。

# ---- 你是谁 ----
user_name: Alex            # 记忆是"关于你"的。提示词里的 {user_name} 会替换成它
language: zh               # zh | en:提炼提示词与快照的语言

# ---- 模型 ----
model: opus                # 后台提炼用的模型。写别名不写版本号:`opus` 永远指向最新的 Opus,
                           # 出新版不用改配置。想钉死某个版本就写完整 ID(如 claude-opus-5-5)
effort: high               # 思考深度(仅 claude-cli 后端);对比实验见 README「为什么是这些默认值」

llm:
  backend: claude-cli      # claude-cli(用本机已登录的 claude,零额外账号)| openai(任何 OpenAI 兼容接口)
  # --- backend: claude-cli ---
  command: claude          # 可执行文件名或绝对路径
  claude_flags:            # 精简出口:关工具/关 skill/关 MCP/不落会话文件,单次背景开销从 ~4.3 万降到 ~1.1 万 token
    - --no-session-persistence
    - --disable-slash-commands
    - --strict-mcp-config
    - --setting-sources
    - local
    - --tools
    - ''
  # --- backend: openai ---
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY   # 只写环境变量名,永远不要把密钥写进配置文件
  temperature: 0.2
  max_tokens: 8000

# ---- 共享层(记忆出机之后放哪)----
sink: local                # local(纯本地文件,零账号)| github(推私有仓库)| feishu(飞书多维表格)
sinks:
  local:
    dir: ''                # 留空 = <数据目录>/share(数据目录默认 ~/.compound-memory,可用 CM_HOME 改)
  github:
    repo_dir: ''           # 一个已经 git clone 好、能免密 push 的目录;留空 = <数据目录>/share-git
    branch: main
    push: true
  feishu:
    cli: lark-cli          # 需要自己先装好并登录
    base_token: ''         # 多维表格 token
    table_id: ''           # 记忆表 id(字段见 docs/sinks.md)
    snapshot_doc: ''       # 快照文档 token;留空则第一次运行时自动创建
    # 可选:每晚确定性填两张流水表(零模型调用;手写内容不覆盖)
    session_table: ''      # 「会话记录」表 id:每个 session 一行
    daily_table: ''        # 「每日日志」表 id:每天一行,会话数 + 事件清单
    meeting_base: ''       # 可选:会议表所在 Base,当天会议也进事件清单
    meeting_table: ''
    log_tz_hours: 8        # 按哪个时区切"一天"

# ---- 额度与规模 ----
nightly_limit: 20          # 每次运行最多处理多少个 session(防止一夜烧穿额度)
window_days: 7             # 只看最近多少天有新对话的 session;首次补历史用 `cm distill --days 120`
max_candidates: 8          # 每个 session 最多提炼几条记忆
text_budget: 14000         # 每个 session 喂给模型的发言字数上限(头 40% + 尾 60%)
snapshot_max_chars: 3200   # 快照正文上限;超了自动压缩(最多压 3 轮,压不动就超着发,不会没有快照)
snapshot_input_budget: 25600   # 喂给快照的记忆总字数上限。「要求」和「线头」一条不删,
                               # 其余按从新到旧填;被挤掉的靠 `cm recall` 找得到
cron: '30 4 * * *'         # 每晚提炼的时间(本机时区)

# ---- 并入别的记忆系统(可选)----
# 每次提炼前,把这些 JSONL 里的新条目并进来(按记忆 ID 去重)。跟旧系统并行过渡时用。
import_sources: []

# ---- 标签改名(可选)----
# 接进一张已有的表、那张表里的选项叫法不同时用。例:labels: {about_user: 关于我}
labels: {}

# ---- 底线附录(可选)----
# 指向一个本机规则文件。它会被原样抄进快照的最后一节,不经模型改写。
# 适合放"不因换机器而变"的硬底线(花钱、对外发信、删数据……)。留空就没有这一节。
baseline_file: ''

# ---- 出问题时通知谁(可选)----
# 一个可执行文件,收两个参数:标题、正文。一轮提炼零产出且有失败时调用。
notify_command: ''

# ---- 读取侧 ----
snapshot_cache_seconds: 3600   # `cm snapshot` 从共享层取快照的缓存时间

recall:                        # `cm recall "话题"` 的检索
  expand: true                 # 先让小模型把问题扩成几个"记忆里可能真出现的说法"再搜。
                               # 一百多条记忆的库上实测 recall@8 75% → 92%(逐题 7 好 1 差)。
                               # 代价:一个没见过的问题多 ~20 秒,之后永久缓存、0.1 秒。
                               # 记忆很少(几十条)时没用 —— 那时 @8 本来就到顶了。
  model: haiku                 # 便宜的小模型就够;同样写别名。换了 llm.backend 记得改成你那边的小模型,
                               # 留空 = 用上面那个 model(贵,不建议)
  effort: low
  terms: 6                     # 最多扩几个说法
  expanded_weight: 0.7         # 扩出来的说法权重低于原问题
  timeout: 45

# ---- 推送前隐私闸(tools/privacy-check.py)----
privacy:
  extra_sources: []        # 除了会话原文和记忆库,还要拿来比对的文件(可写通配),比如别的记忆库、会议转写
                           # 例:['~/old-memory/*.jsonl', '~/meetings/**/*.md']

# ---- 各 harness ----
hosts:
  claude:
    enabled: auto          # auto(装了就用)| true | false
    dir: ~/.claude/projects
    inject: true           # 开局注入:往 ~/.claude/settings.json 加一个 SessionStart hook
  codex:
    enabled: auto
    dir: ~/.codex/sessions
    inject: true           # 开局注入:往 ~/.codex/AGENTS.md 追加一行
  dsh:
    enabled: auto
    dir: ~/.dsh/sessions
    inject: true           # 开局注入:写 ~/.dsh/AGENTS.md(已验证)+ 挂 hook 插件(见 docs/dsh.md)
    plugin_hook: true      # false = 只写 AGENTS.md,不动 dsh profile 的 cordis.patch.yml
    profile_dir: ''        # 留空 = 给 ~/.dsh/profiles/ 下每个 profile 都装
  meeting:                 # 会议转写(可选):采集脚本把 <会议ID>.json + <会议ID>.txt 放到这个目录
    enabled: auto
    dir: ''
    inject: false
    text_budget: 40000     # 会议长,喂给模型的字数放宽
    since: ''              # 这个日期(YYYY-MM-DD)以前的会议一律不读

# 你在会议转写里可能用的其它名字(会议提炼时用来认出哪位说话人是你)
user_aliases: []
